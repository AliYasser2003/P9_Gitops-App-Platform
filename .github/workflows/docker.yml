name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t alyyasser10/p9-app:$IMAGE_TAG .
          docker push alyyasser10/p9-app:$IMAGE_TAG

      - name: Update deploy repo with new image tag
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          IMAGE_TAG=${{ github.sha }}

          git clone https://$DEPLOY_REPO_TOKEN@github.com/AliYasser2003/P9_Gitops-Platform-Deploy.git
          cd P9_Gitops-Platform-Deploy

          sed -i "s/tag:.*/tag: $IMAGE_TAG/" environments/dev/values.yaml

          git config user.name "github-actions"
          git config user.email "ci@github.com"

          git add .
          git commit -m "update image tag to $IMAGE_TAG" || echo "no changes"
          git push
